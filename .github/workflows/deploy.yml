name: Deploy billing-service to cell-01

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "charts/**"
      - "Dockerfile"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cell-01
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  CELL: cell-01
  ECR_REPOSITORY: acme-cell-01/billing-service
  CHART_PATH: charts/billing-service
  RELEASE_NAME: billing-service
  NAMESPACE: billing

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Scan IaC and manifests
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Lint Helm chart
        run: |
          helm lint "$CHART_PATH" -f "$CHART_PATH/values.production.yaml"
          helm template "$CHART_PATH" -f "$CHART_PATH/values.production.yaml" > /dev/null

  build:
    name: Build, scan and push image
    runs-on: ubuntu-latest
    needs: static-analysis
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CELL_01_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build -t "local/billing-service:${GITHUB_SHA}" .

      - name: Scan image and fail on CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/billing-service:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Tag and push
        id: push
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "local/billing-service:${GITHUB_SHA}" "$IMAGE"
          docker push "$IMAGE"
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to cell-01
    runs-on: ubuntu-latest
    needs: build
    environment: cell-01
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CELL_01_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Install Session Manager plugin
        run: |
          curl -sS "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o /tmp/smp.deb
          sudo dpkg -i /tmp/smp.deb

      - name: Open SSM tunnel to the Kubernetes API
        run: |
          aws ssm start-session \
            --target "${{ vars.CELL_01_INSTANCE_ID }}" \
            --document-name AWS-StartPortForwardingSession \
            --parameters '{"portNumber":["6443"],"localPortNumber":["6443"]}' &
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 6443 && break
            sleep 2
          done


      - name: Fetch kubeconfig from Parameter Store
        run: |
          aws ssm get-parameter \
            --name "/acme/${CELL}/kubeconfig" --with-decryption \
            --query Parameter.Value --output text > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Helm upgrade
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$NAMESPACE" --create-namespace \
            -f "$CHART_PATH/values.production.yaml" \
            --set image.repository="${REGISTRY}/${ECR_REPOSITORY}" \
            --set image.tag="${GITHUB_SHA}" \
            --atomic \
            --wait \
            --timeout 10m

      - name: Smoke test
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl -n "$NAMESPACE" rollout status "deploy/${RELEASE_NAME}-billing-service" --timeout=5m
          kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/instance="$RELEASE_NAME"

